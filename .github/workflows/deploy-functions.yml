name: Deploy Firebase Functions and Rules

# Cloud Functions have no auto-deploy path today (see functions/package.json's
# own "deploy" script, meant to be run by hand) — the main app auto-deploys to
# Vercel on every push, but a function's `invoker`/`cors` config, or any other
# change under functions/src, only takes effect once someone remembers to run
# `firebase deploy --only functions` themselves. This closes that gap: any
# push to main touching functions/ deploys automatically, and it's always
# available on demand via the Actions tab (workflow_dispatch).
on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - 'storage.rules'
      - 'firebase.json'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch: {}

env:
  FIREBASE_PROJECT_ID: pangansari-utama

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install function dependencies
        working-directory: functions
        run: npm install

      - name: Build functions
        working-directory: functions
        run: npm run build

      # Authenticates as a GCP service account (see repo secret
      # FIREBASE_SERVICE_ACCOUNT below) — the Firebase CLI picks up the
      # credentials this exports via GOOGLE_APPLICATION_CREDENTIALS
      # automatically, no login:ci token needed.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # --force lets the Firebase CLI set up the Artifact Registry cleanup
      # policy for old function container images on its own; without it a
      # non-interactive deploy succeeds but still exits 1.
      - name: Deploy to Firebase
        run: npx firebase-tools@14 deploy --only functions --project "$FIREBASE_PROJECT_ID" --non-interactive --force

      # Security rules live in this repo (firestore.rules / storage.rules)
      # but used to be deployed by hand, so the live rules drifted behind
      # what the app expects. Deploy them on every push that touches them.
      # Needs the service account to have the "Firebase Rules Admin" role.
      - name: Deploy Firestore and Storage rules
        run: npx firebase-tools@14 deploy --only firestore:rules,storage --project "$FIREBASE_PROJECT_ID" --non-interactive
