name: Firestore rules tests

# Runs tests/rules/*.test.mjs against the Firestore emulator whenever the
# rules or their tests change — on pull requests, so a rules change that
# opens a hole is caught before merge. The deploy workflow also runs them
# before it publishes rules.
on:
  pull_request:
    paths:
      - 'firestore.rules'
      - 'tests/rules/**'
      - 'package.json'
      - '.github/workflows/rules-tests.yml'
  workflow_dispatch: {}

jobs:
  rules-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - run: npm run test:rules
